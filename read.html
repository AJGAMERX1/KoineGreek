<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhema — Read</title>
<meta name="theme-color" content="#16795A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rhema">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=EB+Garamond:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme-classic.css">
<link rel="stylesheet" href="css/theme-lexis.css">
<link rel="stylesheet" href="css/theme-nous.css">
</head>
<body>

<div class="app-shell reader-shell">

  <div class="topbar reader-bar">
    <div class="reader-nav">
      <button class="icon-btn" id="prevCh" type="button" aria-label="Previous chapter">
        <svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <select class="select" id="bookSel" aria-label="Book"></select>
      <select class="select" id="chSel" aria-label="Chapter"></select>
      <button class="icon-btn" id="nextCh" type="button" aria-label="Next chapter">
        <svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="reader-tools">
      <div class="pill-group" id="trPills"></div>
      <button class="pill" id="markToggle" type="button" title="Underline words not yet in your vocabulary">Mark new</button>
    </div>
  </div>

  <div class="reader-body" id="body">
    <p style="padding:20px;color:var(--muted);font-size:13px">Loading…</p>
  </div>

  <div class="gloss-sheet" id="sheet" hidden>
    <button class="icon-btn sheet-close" id="sheetClose" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    </button>
    <div id="sheetBody"></div>
  </div>

  <div class="bottom-nav" id="nav"></div>

</div>

<script type="module">
  /*
    Read tab — parallel Greek / English reader over the whole NT (SBLGNT +
    WEB/KJV/YLT), Logos-style: verse-aligned columns on wide screens, verse
    pairs on phones, every Greek word one tap from its gloss and parse (M23).
    Not a lesson: nothing here is scheduled or scored; "Study this chapter"
    hands off to the curriculum's reading lesson when one exists.
  */
  import { initTheme } from './js/theme.js';
  import { initPwa } from './js/pwa.js';
  import { renderNav } from './js/nav.js';
  import { loadBook, loadLexicon, loadCurriculum, loadStats } from './js/data.js';
  import { getSettings, setSettings, getAllVocabRecords } from './js/storage.js';
  import { annotate, isWordToken, normalizedForm, TRANSLATIONS } from './js/reading.js';
  import { describeParse, describePos } from './js/morph.js';
  import { escapeHtml, speakerHtml } from './js/session-view.js';
  import { initSpeech } from './js/speech.js';

  initTheme();
  initPwa();
  initSpeech();
  renderNav(document.getElementById('nav'), 'read');

  const params = new URLSearchParams(location.search);
  const settings = getSettings();
  const state = {
    books: [], slug: params.get('book') || (settings.lastRead && settings.lastRead.book) || 'john',
    chapter: Number(params.get('chapter')) || (settings.lastRead && settings.lastRead.chapter) || 1,
    translation: settings.translation || 'web', mark: settings.markUnknown !== false,
    lexicon: null, records: {}, lessons: new Map(), book: null,
  };

  const body = document.getElementById('body');
  const sheet = document.getElementById('sheet');
  document.getElementById('sheetClose').addEventListener('click', () => { sheet.hidden = true; body.querySelectorAll('.w.active').forEach((el) => el.classList.remove('active')); });

  main().catch((err) => { console.error(err); body.innerHTML = `<div class="card" style="margin:20px">Could not load: ${escapeHtml(err.message)}. Run from a local server (see README).</div>`; });

  async function main() {
    const [stats, lexicon, curriculum] = await Promise.all([loadStats(), loadLexicon(), loadCurriculum()]);
    state.books = stats.books.slice().sort((a, b) => a.number - b.number);
    state.lexicon = lexicon;
    state.records = getAllVocabRecords();
    for (const u of curriculum.units) for (const l of u.lessons) if (l.reading && l.reading.from === 1) state.lessons.set(`${l.reading.book}-${l.reading.chapter}`, l.id);

    const bookSel = document.getElementById('bookSel');
    bookSel.innerHTML = state.books.map((b) => `<option value="${b.book}">${escapeHtml(b.name)}</option>`).join('');
    bookSel.addEventListener('change', () => go(bookSel.value, 1));
    document.getElementById('chSel').addEventListener('change', (e) => go(state.slug, Number(e.target.value)));
    document.getElementById('prevCh').addEventListener('click', () => step(-1));
    document.getElementById('nextCh').addEventListener('click', () => step(1));
    document.getElementById('trPills').innerHTML = TRANSLATIONS.map((t) => `<button class="pill" type="button" data-tr="${t.id}" title="${escapeHtml(t.name)}">${t.label}</button>`).join('');
    document.querySelectorAll('#trPills .pill').forEach((p) => p.addEventListener('click', () => { state.translation = p.dataset.tr; setSettings({ translation: state.translation }); render(); }));
    const markToggle = document.getElementById('markToggle');
    markToggle.addEventListener('click', () => { state.mark = !state.mark; setSettings({ markUnknown: state.mark }); render(); });
    await go(state.slug, state.chapter);
  }

  function bookMeta() { return state.books.find((b) => b.book === state.slug); }

  function step(delta) {
    const meta = bookMeta();
    let ch = state.chapter + delta;
    let slug = state.slug;
    if (ch < 1) { const i = state.books.findIndex((b) => b.book === slug); if (i === 0) return; slug = state.books[i - 1].book; ch = state.books[i - 1].chapters; }
    else if (ch > meta.chapters) { const i = state.books.findIndex((b) => b.book === slug); if (i === state.books.length - 1) return; slug = state.books[i + 1].book; ch = 1; }
    go(slug, ch);
  }

  async function go(slug, chapter) {
    state.slug = slug; state.chapter = chapter;
    if (!state.book || state.book.slug !== slug) state.book = await loadBook(slug);
    if (!state.book.chapters[String(chapter)]) { state.chapter = 1; chapter = 1; }
    setSettings({ lastRead: { book: slug, chapter } });
    history.replaceState(null, '', `?book=${slug}&chapter=${chapter}`);
    const meta = bookMeta();
    document.getElementById('bookSel').value = slug;
    const chSel = document.getElementById('chSel');
    chSel.innerHTML = Array.from({ length: meta.chapters }, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join('');
    chSel.value = String(chapter);
    document.title = `Rhema — ${meta.name} ${chapter}`;
    sheet.hidden = true;
    render();
    body.scrollTop = 0;
  }

  function render() {
    document.querySelectorAll('#trPills .pill').forEach((p) => p.classList.toggle('active', p.dataset.tr === state.translation));
    document.getElementById('markToggle').classList.toggle('active', state.mark);
    const meta = bookMeta();
    const verses = Object.values(state.book.chapters[String(state.chapter)]);
    const lessonId = state.lessons.get(`${state.slug}-${state.chapter}`);
    const trName = TRANSLATIONS.find((t) => t.id === state.translation).name;
    let known = 0, tokens = 0;
    const rows = verses.map((v) => {
      const words = annotate(v, state.lexicon, state.records);
      for (const w of words) if (isWordToken(w)) { tokens++; if (w.known) known++; }
      const gr = words.map((w, i) => isWordToken(w)
        ? `<span class="w ${state.mark && !w.known ? 'unknown' : 'known'}" data-v="${v.id}" data-i="${i}" role="button" tabindex="0">${escapeHtml(w.t)}</span>`
        : `<span class="punct">${escapeHtml(w.t)}</span>`).join(' ');
      const en = v.translations[state.translation] || Object.values(v.translations)[0] || '';
      const num = v.id.split('-').pop();
      return `<div class="pv-row" id="${v.id}"><div class="pv-num">${num}</div><div class="pv-gr" lang="grc">${gr}${speakerHtml(v.words.map((w) => w.t).join(' '), { small: true })}</div><div class="pv-en">${escapeHtml(en)}</div></div>`;
    }).join('');
    body.innerHTML = `
      <div class="reader-head">
        <div>
          <div class="drill-kicker">${escapeHtml(state.book.greekTitle)}</div>
          <div class="unit-title" style="margin:0">${escapeHtml(meta.name)} ${state.chapter}</div>
          <div class="unit-sub">SBL Greek New Testament · ${escapeHtml(trName)} · ${tokens ? Math.round((known / tokens) * 100) : 0}% of words in your vocabulary</div>
        </div>
        ${lessonId ? `<a class="btn secondary" href="reading.html?lesson=${encodeURIComponent(lessonId)}">Study this chapter</a>` : ''}
      </div>
      <div class="pv-head"><div></div><div>Greek</div><div>English</div></div>
      ${rows}
      <div class="reader-foot"><button class="btn secondary" id="footPrev" type="button">‹ Previous</button><button class="btn" id="footNext" type="button">Next chapter ›</button></div>`;
    body.querySelectorAll('.w').forEach((el) => el.addEventListener('click', () => tap(el)));
    document.getElementById('footPrev').addEventListener('click', () => step(-1));
    document.getElementById('footNext').addEventListener('click', () => step(1));
  }

  function tap(el) {
    const v = Object.values(state.book.chapters[String(state.chapter)]).find((x) => x.id === el.dataset.v);
    const w = annotate(v, state.lexicon, state.records)[Number(el.dataset.i)];
    if (!w.item) return;
    body.querySelectorAll('.w.active').forEach((x) => x.classList.remove('active'));
    el.classList.add('active');
    const it = w.item;
    const status = w.known ? 'in your vocabulary' : w.glossOnly ? `rare (${it.count}× in the NT)` : 'not yet in your vocabulary';
    document.getElementById('sheetBody').innerHTML = `
      <div class="gloss-head"><span class="gloss-form">${escapeHtml(normalizedForm(w))}</span><span class="gloss-pos">${escapeHtml(describePos(w.p, w.m))}</span></div>
      <div class="gloss-parse">${escapeHtml(describeParse(w.p, w.m))}</div>
      <div class="gloss-lemma"><span class="k">from</span> <b>${escapeHtml(it.citation)}</b> — ${escapeHtml(it.gloss)}</div>
      <div class="gloss-status">${escapeHtml(status)} · rank ${it.rank} · <a href="lexicon.html?q=${encodeURIComponent(it.lemma)}">open in Lexicon</a></div>`;
    sheet.hidden = false;
  }
</script>

</body>
</html>
