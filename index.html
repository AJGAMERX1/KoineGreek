<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhema — Learn Koine Greek</title>
<meta name="description" content="A Duolingo-style app for learning New Testament Koine Greek.">
<script src="js/recover.js"></script>
<meta name="theme-color" content="#16795A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rhema">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=EB+Garamond:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme-classic.css">
<link rel="stylesheet" href="css/theme-lexis.css">
<link rel="stylesheet" href="css/theme-nous.css">
</head>
<body>

<div class="app-shell">

  <div class="topbar">
    <div class="app-name" id="appName">Rhema</div>
    <div class="stat-group">
      <div class="stat accent">
        <svg class="stat-icon" viewBox="0 0 24 24"><path d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1-.5-2-1-3 2 1 3 4 3 6a6 6 0 0 1-12 0c0-4 2-6 4-10z" fill="currentColor"/></svg>
        <span id="streakStat">0</span>
      </div>
      <div class="stat gold">
        <svg class="stat-icon" viewBox="0 0 24 24"><path d="M4 9l4-6h8l4 6-10 12L4 9z" fill="currentColor"/></svg>
        <span id="xpStat">0</span>
      </div>
    </div>
  </div>

  <div class="path-layout">

  <aside class="book-list" id="bookList" aria-label="Books"></aside>

  <div class="path-main">

  <div class="unit-header">
    <div class="unit-header-row">
      <div>
        <div class="unit-kicker" id="unitKicker">&nbsp;</div>
        <div class="unit-title" id="unitTitle">&nbsp;</div>
        <div class="unit-sub" id="unitSub">&nbsp;</div>
      </div>
      <div class="unit-nav">
        <button class="unit-nav-btn" id="prevUnit" type="button" aria-label="Previous book">‹</button>
        <button class="unit-nav-btn" id="nextUnit" type="button" aria-label="Next book">›</button>
      </div>
    </div>
  </div>

  <div class="install-banner" id="installBanner" hidden>
    <span>Install Rhema on this device to study offline.</span>
    <button class="btn secondary" id="installBtn" type="button">Install</button>
  </div>

  <div class="placement-link" id="placementLink" hidden>Already know some Greek? <a href="placement.html">Take the placement test</a> and start at your level.</div>

  <div class="due-banner" id="dueBanner" hidden>
    <span><strong id="dueCount">0</strong> <span id="dueLabel">words due for review</span></span>
    <button class="btn" id="dueBtn" type="button">Review now</button>
  </div>

  <div class="lesson-path" id="lessonPath">
    <p style="padding:8px 4px;color:var(--muted);font-size:13px">Loading unit…</p>
  </div>

  </div><!-- /.path-main -->
  </div><!-- /.path-layout -->

  <div class="bottom-nav" id="nav"></div>

</div>

<script type="module">
  import { initTheme, APP_NAME } from './js/theme.js';
  import { initDev } from './js/dev.js';
  import { initPwa, canInstall, onInstallAvailable, promptInstall, isStandalone } from './js/pwa.js';
  import { renderNav } from './js/nav.js';
  import { getProgress, getSettings, getAllVocabRecords, getDueVocabItems, getDueFormIds, getDueVerseIds } from './js/storage.js';
  import { chainHref } from './js/chain.js';

  // ---- app name ----
  document.getElementById('appName').textContent = APP_NAME;
  document.title = `${APP_NAME} — Learn Koine Greek`;

  // ---- theme + mode, wired to js/theme.js + js/storage.js ----
  initTheme();
  initPwa();
  initDev();

  renderNav(document.getElementById('nav'), 'path');

  // "Add to Home Screen" nudge, shown only when the browser offers an install prompt (PWA).
  const installBanner = document.getElementById('installBanner');
  const showInstall = (available) => { installBanner.hidden = !available || isStandalone(); };
  showInstall(canInstall());
  onInstallAvailable(showInstall);
  document.getElementById('installBtn').addEventListener('click', async () => { await promptInstall(); showInstall(false); });

  // ---- progress stats, read from real storage (starts at 0 for a new learner) ----
  const progress = getProgress();
  document.getElementById('streakStat').textContent = progress.streak;
  document.getElementById('xpStat').textContent = progress.xp;

  // ---- due reviews banner (PEDAGOGY M3: "due today" is the primary unit of a session) ----
  // Words, forms (paradigm cells, principal parts) and verses are all SRS objects; one button
  // runs everything due as a single chained session: words → forms → verses (PEDAGOGY M3).
  const dueIds = getDueVocabItems(Object.keys(getAllVocabRecords()));
  const dueForms = getDueFormIds();
  const dueVerses = getDueVerseIds();
  const chain = [];
  if (dueIds.length) chain.push('drill');
  if (dueForms.length) chain.push('grammar');
  if (dueVerses.length) chain.push('reading');
  if (chain.length) {
    const bits = [];
    if (dueIds.length) bits.push(`${dueIds.length} word${dueIds.length === 1 ? '' : 's'}`);
    if (dueForms.length) bits.push(`${dueForms.length} form${dueForms.length === 1 ? '' : 's'}`);
    if (dueVerses.length) bits.push(`${dueVerses.length} verse${dueVerses.length === 1 ? '' : 's'}`);
    document.getElementById('dueCount').textContent = bits.join(' · ');
    document.getElementById('dueLabel').textContent = 'due for review';
    document.getElementById('dueBanner').hidden = false;
  }
  document.getElementById('dueBtn').addEventListener('click', () => { location.href = chainHref(chain); });

  // Offer the placement test until the learner has finished a lesson (it stays available in Settings).
  document.getElementById('placementLink').hidden = getProgress().lessonsCompleted.length > 0;

  // ---- lesson path, driven by data/curriculum.json + progress.lessonsCompleted ----
  // The curriculum index lists every Book (unit) and its lessons; full lesson
  // content (vocab, paradigms, rule text, verses) lives in data/units/<id>.json
  // and is loaded by the lesson screens, not here.
  let curriculum = null;
  let unitIndex = 0;
  loadCurriculum();

  async function loadCurriculum() {
    try {
      const res = await fetch('./data/curriculum.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      curriculum = await res.json();
      unitIndex = currentUnitIndex(curriculum.units, progress.lessonsCompleted);
      renderUnit();
    } catch (err) {
      console.warn('Could not load curriculum:', err);
      document.getElementById('lessonPath').innerHTML =
        '<p style="padding:8px 4px;color:var(--muted);font-size:13px">' +
        'Could not load lesson data. If you opened this file directly (file://), ' +
        'run it from a local server instead — see README.md &gt; Running locally.' +
        '</p>';
    }
  }

  /** The first Book with an unfinished lesson (or the last Book if everything is done). */
  function currentUnitIndex(units, done) {
    const i = units.findIndex((u) => u.lessons.some((l) => !done.includes(l.id)));
    return i === -1 ? units.length - 1 : i;
  }

  /**
   * Lessons unlock in curriculum order (PEDAGOGY: the path is a scaffold, and later material
   * assumes the earlier). A lesson is:
   *   complete — in progress.lessonsCompleted
   *   active   — the first incomplete lesson in the whole curriculum ("up next")
   *   open     — incomplete, but the lesson before it is complete (gaps left by the placement test)
   *   locked   — everything else, unless settings.unlockAll is on
   */
  const allLessons = () => curriculum.units.flatMap((u) => u.lessons);
  function lessonState(unit, lesson, done) {
    if (done.includes(lesson.id)) return 'complete';
    const seq = allLessons();
    const i = seq.findIndex((l) => l.id === lesson.id);
    const firstIncomplete = seq.find((l) => !done.includes(l.id));
    if (firstIncomplete && firstIncomplete.id === lesson.id) return 'active';
    if (getSettings().unlockAll || getSettings().dev || i === 0 || done.includes(seq[i - 1].id)) return 'open';
    return 'locked';
  }

  document.getElementById('prevUnit').addEventListener('click', () => { if (unitIndex > 0) { unitIndex--; renderUnit(); } });
  document.getElementById('nextUnit').addEventListener('click', () => { if (curriculum && unitIndex < curriculum.units.length - 1) { unitIndex++; renderUnit(); } });

  function renderBookList() {
    const done = progress.lessonsCompleted;
    const list = document.getElementById('bookList');
    list.innerHTML = curriculum.units.map((u, i) => {
      const n = u.lessons.filter((l) => done.includes(l.id)).length;
      return `<button class="book-item ${i === unitIndex ? 'active' : ''} ${n === u.lessons.length ? 'done' : ''}" type="button" data-i="${i}">
        <span class="book-item-kicker">${escapeHtml(u.kicker)}</span>
        <span class="book-item-title">${escapeHtml(u.sub)}</span>
        <span class="book-item-count">${n}/${u.lessons.length}</span>
      </button>`;
    }).join('');
    list.querySelectorAll('.book-item').forEach((b) => b.addEventListener('click', () => { unitIndex = Number(b.dataset.i); renderUnit(); }));
    const active = list.querySelector('.book-item.active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  }

  function renderUnit() {
    const unit = curriculum.units[unitIndex];
    const done = progress.lessonsCompleted;
    renderBookList();
    document.getElementById('unitKicker').textContent = `${unit.kicker} · ${unitIndex + 1} of ${curriculum.units.length}`;
    document.getElementById('unitTitle').textContent = unit.title;
    document.getElementById('unitSub').textContent = unit.sub;
    document.getElementById('prevUnit').disabled = unitIndex === 0;
    document.getElementById('nextUnit').disabled = unitIndex === curriculum.units.length - 1;

    const container = document.getElementById('lessonPath');
    container.innerHTML = '';
    unit.lessons.forEach((lesson) => {
      const node = renderNode({ ...lesson, state: lessonState(unit, lesson, done), sub: lessonSub(lesson) });
      // Alphabet lessons open the alphabet screen, reading lessons open Read & Translate (which
      // sends the learner through the vocab drill first if the passage has new words), grammar/verb
      // lessons with paradigms or a strange-verb pool open the grammar screen (which hands off to the
      // vocab drill afterwards), and every other lesson with vocabulary opens the vocab drill.
      // Locked lessons do not open: finish the one before, take the placement test, or switch on
      // "Unlock all lessons" in Settings.
      const state = lessonState(unit, lesson, done);
      const hasGrammar = (lesson.paradigms && lesson.paradigms.length) || lesson.irregularCount;
      const href = lesson.type === 'alphabet' ? `alphabet.html?lesson=${encodeURIComponent(lesson.id)}`
        : lesson.type === 'reading' ? `reading.html?lesson=${encodeURIComponent(lesson.id)}`
        : hasGrammar ? `grammar.html?lesson=${encodeURIComponent(lesson.id)}`
        : lesson.vocabCount ? `drill.html?lesson=${encodeURIComponent(lesson.id)}` : null;
      if (href && state !== 'locked') {
        node.classList.add('linked');
        node.addEventListener('click', () => { location.href = href; });
      } else if (state === 'locked') {
        node.title = 'Finish the previous lesson first (or unlock all lessons in Settings)';
        node.addEventListener('click', () => { node.classList.add('shake'); setTimeout(() => node.classList.remove('shake'), 400); });
      }
      container.appendChild(node);
    });
  }

  function lessonSub(lesson) {
    const bits = [lesson.sub];
    if (lesson.vocabCount) bits.push(`${lesson.vocabCount} words`);
    if (lesson.paradigms && lesson.paradigms.length) bits.push(`${lesson.paradigms.length} paradigm${lesson.paradigms.length > 1 ? 's' : ''}`);
    if (lesson.irregularCount) bits.push(`${lesson.irregularCount} strange verb${lesson.irregularCount > 1 ? 's' : ''}`);
    return bits.join(' · ');
  }

  function renderNode(lesson) {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'lesson-node';
    el.dataset.state = lesson.state;
    el.innerHTML = `
      <div class="node-dot">${nodeIcon(lesson.state)}</div>
      <div class="node-text">
        <div class="node-label">${escapeHtml(lesson.label)}</div>
        <div class="node-sub">${escapeHtml(lesson.sub)}</div>
      </div>
      <div class="node-status">${statusLabel(lesson.state)}</div>
    `;
    return el;
  }

  function statusLabel(state) {
    if (state === 'complete') return 'Completed';
    if (state === 'active') return 'Up next';
    if (state === 'open') return 'Ready';
    return 'Locked';
  }

  function nodeIcon(state) {
    if (state === 'complete') {
      return '<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17l-6.1 3.6 1.4-6.8-5.1-4.7 6.9-.8L12 2z" fill="currentColor"/></svg>';
    }
    if (state === 'active' || state === 'open') {
      return '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5z" fill="currentColor"/></svg>';
    }
    return '<svg viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 1 1 12 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h1zm2 0h8V8a4 4 0 1 0-8 0v2z" fill="currentColor"/></svg>';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
