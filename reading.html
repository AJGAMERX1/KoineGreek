<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhema — Read &amp; Translate</title>
<script src="js/recover.js"></script>
<meta name="theme-color" content="#16795A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rhema">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=EB+Garamond:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme-classic.css">
<link rel="stylesheet" href="css/theme-lexis.css">
<link rel="stylesheet" href="css/theme-nous.css">
</head>
<body>

<div class="app-shell">

  <div class="drill-top">
    <button class="icon-btn" id="backBtn" type="button" aria-label="Back to path">
      <svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="progress" aria-label="Reading progress"><div class="progress-fill" id="progressFill"></div></div>
    <div class="stat gold">
      <svg class="stat-icon" viewBox="0 0 24 24"><path d="M4 9l4-6h8l4 6-10 12L4 9z" fill="currentColor"/></svg>
      <span id="xpStat">0</span>
    </div>
  </div>

  <div class="drill-body" id="body">
    <p style="color:var(--muted);font-size:13px">Loading…</p>
  </div>

  <div class="drill-footer" id="footer" hidden>
    <button class="btn" id="continueBtn" type="button">Reveal</button>
  </div>

</div>

<script type="module">
  /*
    Read & Translate (README § Exercise types; PEDAGOGY M14–M16, M23–M25).
    Logic: js/reading.js + js/morph.js. Shared UI: js/session-view.js.
  */
  import { initTheme } from './js/theme.js';
  import { initPwa } from './js/pwa.js';
  import { loadLesson, loadLexicon, loadBook, loadWordPictures, loadStrongs, strongsFor } from './js/data.js';
  import { getProgress, getSettings, setSettings, getAllVocabRecords, getVocabItem, updateVocabItem, readStore, getReadingRecord, setReadingRecord, getDueVerseIds, addXp, recordActivity, markLessonCompleted, getSession, saveSession, clearSession } from './js/storage.js';
  import { nextInChain, chainLabel } from './js/chain.js';
  import { scheduleReview } from './js/srs.js';
  import { annotate, coverage, xpForVerse, rateVerse, startIndex, suggestWords, isWordToken, normalizedForm, TRANSLATIONS } from './js/reading.js';
  import { describeParse, describePos } from './js/morph.js';
  import { SessionView, escapeHtml, speakerHtml } from './js/session-view.js';
  import { initSpeech, autoSpeak } from './js/speech.js';
  import { initSfx, playTick, playComplete } from './js/sfx.js';

  initTheme();
  initPwa();
  initSpeech();
  initSfx();
  document.documentElement.setAttribute('data-screen', 'reading');
  const view = new SessionView();
  const xpStat = document.getElementById('xpStat');
  xpStat.textContent = getProgress().xp;
  document.getElementById('backBtn').addEventListener('click', () => { location.href = 'index.html'; });

  const params = new URLSearchParams(location.search);
  const lessonId = params.get('lesson');
  const mode = params.get('mode') || (lessonId ? 'lesson' : 'due');
  const MAX_DUE_VERSES = 20;
  const state = {
    lesson: null, lexicon: null, verses: [], index: 0, records: {}, translation: getSettings().translation || 'web',
    reveals: [], allReveals: [], rated: 0, xpEarned: 0, coverages: [], revealed: false, active: null,
    wp: {}, strongs: null,
  };
  loadStrongs().then((s) => { state.strongs = s; }).catch(() => {});

  main().catch((err) => { console.error(err); view.renderError(`Could not load this reading: ${err.message}. Run from a local server (see README).`); });

  async function main() {
    if (mode === 'due') { await mainDue(); return; }
    const [{ lesson }, lexicon] = await Promise.all([loadLesson(lessonId), loadLexicon()]);
    if (!lesson.reading) throw new Error(`${lessonId} has no reading`);
    state.lesson = lesson; state.lexicon = lexicon;
    document.title = `Rhema — ${lesson.sub}`;

    // Prep vocabulary first (the lesson's own new words are drilled before reading — i+1, M16)
    const unstudied = lesson.vocab.filter((v) => !getVocabItem(v.id));
    if (unstudied.length) { renderPrep(unstudied); return; }

    const book = await loadBook(lesson.reading.book);
    const chapter = book.chapters[String(lesson.reading.chapter)];
    state.verses = lesson.reading.verseIds.map((id) => {
      const v = Object.values(chapter).find((x) => x.id === id);
      return { ...v, number: Number(id.split('-').pop()), chapter: lesson.reading.chapter, bookName: book.book, greekTitle: book.greekTitle };
    });
    state.records = getAllVocabRecords();
    state.sessionKey = `reading:${lessonId}`;
    if (await offerResume()) return;
    state.index = startIndex(lesson.reading.verseIds, readStore().readingHistory);
    renderVerse();
  }

  // ---- resume: verses are rebuilt from the books, only progress and reveals are stored ----
  function snapshot() {
    return { verseIds: state.verses.map((v) => v.id), index: state.index, rated: state.rated, xpEarned: state.xpEarned, coverages: state.coverages,
      reveals: state.allReveals.map((w) => w.l) };
  }
  async function offerResume() {
    const saved = getSession(state.sessionKey);
    if (!saved || saved.index === 0 || saved.index >= state.verses.length) return false;
    if (saved.verseIds.join() !== state.verses.map((v) => v.id).join()) return false;
    return new Promise((resolve) => {
      view.renderResume({ title: state.lesson ? state.lesson.reading.reference : 'Due verses', detail: `You had read ${saved.rated} of ${state.verses.length} verses. Resume, or start from the first verse.` },
        () => {
          state.index = saved.index; state.rated = saved.rated; state.xpEarned = saved.xpEarned; state.coverages = saved.coverages || [];
          state.allReveals = (saved.reveals || []).map((l) => { const item = state.lexicon.byId.get(l); return item && { l, item, known: !!state.records[l], glossOnly: item.count < 10 }; }).filter(Boolean);
          renderVerse(); resolve(true);
        },
        () => { clearSession(state.sessionKey); state.index = 0; renderVerse(); resolve(true); });
    });
  }

  /** Due-verse review (part of the daily chain): every verse whose reading record is due, oldest first. */
  async function mainDue() {
    document.title = 'Rhema — Review verses';
    state.lexicon = await loadLexicon();
    state.records = getAllVocabRecords();
    const ids = getDueVerseIds().slice(0, MAX_DUE_VERSES);
    if (!ids.length) { renderEmpty(); return; }
    const slugOf = (id) => id.split('-').slice(0, -2).join('-');
    const books = {};
    for (const slug of new Set(ids.map(slugOf))) books[slug] = await loadBook(slug);
    state.verses = ids.map((id) => {
      const [ch, v] = id.split('-').slice(-2).map(Number);
      const book = books[slugOf(id)];
      const verse = Object.values(book.chapters[String(ch)] || {}).find((x) => x.id === id);
      return verse && { ...verse, number: v, chapter: ch, bookName: book.book, greekTitle: book.greekTitle };
    }).filter(Boolean);
    state.sessionKey = 'reading:due';
    if (await offerResume()) return;
    state.index = 0;
    renderVerse();
  }

  function renderEmpty() {
    view.renderSummary({ kicker: 'Review', html: `<div class="card"><div class="rule-title">No verses are due</div><p class="rule-body" style="color:var(--muted)">Verses you have rated come back on their own schedule.</p></div>`,
      buttonLabel: nextInChain(params) ? chainLabel(params) : 'Back to path' }, () => { location.href = nextInChain(params) || 'index.html'; });
  }

  // ------------------------------------------------------------ prep vocab gate

  function renderPrep(unstudied) {
    const url = `drill.html?lesson=${encodeURIComponent(state.lesson.id)}&return=${encodeURIComponent(`reading.html?lesson=${state.lesson.id}`)}`;
    view.renderIntro({
      kicker: 'Before you read',
      html: `<div class="card">
        <div class="rule-title">${escapeHtml(state.lesson.reading.reference)} uses ${unstudied.length} word${unstudied.length === 1 ? '' : 's'} you have not met</div>
        <p class="rule-body">Learn them first, then come back and read. Everything else in the passage will be one tap from its meaning.</p>
        <div class="summary-list">${unstudied.map((v) => `<div><span class="greek">${escapeHtml(v.lemma)}</span> — ${escapeHtml(v.gloss)}</div>`).join('')}</div>
      </div>`,
      buttonLabel: 'Learn the words',
    }, () => { location.href = url; });
  }

  // ------------------------------------------------------------ verse screen

  function renderVerse() {
    const verse = state.verses[state.index];
    if (!verse) { renderSummary(); return; }
    if (state.index > 0) saveSession(state.sessionKey, snapshot());
    view.setProgress(state.index / state.verses.length);
    state.reveals = []; state.revealed = false; state.active = null;
    const words = annotate(verse, state.lexicon, state.records);
    state.words = words;
    const cov = coverage(words);
    state.coverages.push(cov);
    const rule = state.index === 0 && state.lesson && state.lesson.rule ? `
      <div class="card">
        <div class="rule-title">${escapeHtml(state.lesson.rule.title)}</div>
        <p class="rule-body">${escapeHtml(state.lesson.rule.body)}</p>
      </div>` : '';

    view.body.innerHTML = `
      <div class="drill-kicker">${state.lesson ? '' : 'Review · '}${escapeHtml(verse.greekTitle)} · ${escapeHtml(verse.bookName)} ${verse.chapter}:${verse.number} · ${state.index + 1} of ${state.verses.length}</div>
      ${rule}
      <div class="card">
        <div class="verse" id="verse" lang="grc">${words.map((w, i) => wordHtml(w, i)).join(' ')}</div>
        <div class="verse-meta"><span>${Math.round(cov.knownShare * 100)}% of these words are in your vocabulary${speakerHtml(verseText(verse), { small: true, verse: true })}</span><span class="legend"><span class="w unknown">dotted</span> = tap for meaning</span></div>
      </div>
      <div class="gloss-panel" id="gloss" hidden></div>
      <div id="reveal"></div>`;
    view.body.scrollTop = 0;
    view.body.querySelectorAll('.w[data-i]').forEach((el) => el.addEventListener('click', () => tapWord(Number(el.dataset.i))));
    view.showFooter('Reveal the translation', reveal);
    autoSpeak(verseText(verse), { verse: true });
  }

  function verseText(verse) { return verse.words.map((w) => w.t).join(' '); }

  function wordHtml(w, i) {
    if (!isWordToken(w)) return `<span class="punct">${escapeHtml(w.t)}</span>`;
    const cls = w.known ? 'known' : 'unknown';
    return `<span class="w ${cls}" data-i="${i}" role="button" tabindex="0">${escapeHtml(w.t)}</span>`;
  }

  function tapWord(i) {
    const w = state.words[i];
    if (!w.item) return;
    view.body.querySelectorAll('.w.active').forEach((el) => el.classList.remove('active'));
    const el = view.body.querySelector(`.w[data-i="${i}"]`);
    el.classList.add('active');
    if (!state.reveals.some((r) => r === w)) { state.reveals.push(w); state.allReveals.push(w); }
    const it = w.item;
    const status = w.known ? 'in your vocabulary' : w.glossOnly ? `rare (${it.count}× in the NT) — glossed, never drilled` : 'not yet in your vocabulary';
    const strongs = strongsFor(it, state.strongs);
    const panel = document.getElementById('gloss');
    panel.hidden = false;
    panel.innerHTML = `
      <div class="gloss-head"><span class="gloss-form">${escapeHtml(normalizedForm(w))}</span><span class="gloss-pos">${escapeHtml(describePos(w.p, w.m))}</span></div>
      <div class="gloss-parse">${escapeHtml(describeParse(w.p, w.m))}</div>
      <div class="gloss-lemma"><span class="k">from</span> <b>${escapeHtml(it.citation)}</b> — ${escapeHtml(it.gloss)}</div>
      <div class="gloss-status">${escapeHtml(status)}</div>
      ${strongs.length ? `<button class="more-btn" type="button" id="moreStrongs">More · Strong's ${strongs.map((x) => 'G' + x.number).join(', ')}</button><div id="strongsBox" hidden>${strongs.map((x) => `<div class="strongs"><span class="k">Strong's G${x.number}</span> <b>${escapeHtml(x.lemma || '')}</b> ${escapeHtml(x.translit || '')} <span class="pron">${escapeHtml(x.pron || '')}</span><div>${escapeHtml(x.def)}</div></div>`).join('')}</div>` : ''}`;
    const more = document.getElementById('moreStrongs');
    if (more) more.addEventListener('click', () => { const box = document.getElementById('strongsBox'); box.hidden = !box.hidden; more.textContent = (box.hidden ? 'More' : 'Less') + more.textContent.slice(more.textContent.indexOf(' ·')); });
    panel.scrollIntoView({ block: 'nearest' });
  }

  function reveal() {
    if (state.revealed) return;
    state.revealed = true;
    view.hideFooter();
    const verse = state.verses[state.index];
    const box = document.getElementById('reveal');
    box.innerHTML = `
      <div class="card">
        <div class="tr-head">
          <div class="pill-group" id="trPills">${TRANSLATIONS.map((t) => `<button class="pill ${t.id === state.translation ? 'active' : ''}" type="button" data-tr="${t.id}" title="${escapeHtml(t.name)}">${t.label}</button>`).join('')}</div>
        </div>
        <div class="tr-text" id="trText"></div>
      </div>
      <div class="card wp-card" id="wpCard">
        <button class="more-btn" type="button" id="wpBtn" style="margin-top:0">Word Pictures · Robertson's note on this verse</button>
        <div id="wpBody" hidden></div>
      </div>
      <div class="rate">
        <div class="rate-label">How close was your reading?</div>
        <div class="rate-buttons">
          <button class="rate-btn miss" type="button" data-rating="miss">Missed it</button>
          <button class="rate-btn close" type="button" data-rating="close">Close</button>
          <button class="rate-btn nailed" type="button" data-rating="nailed">Nailed it</button>
        </div>
      </div>`;
    const showTr = () => {
      const t = verse.translations[state.translation] || Object.values(verse.translations)[0] || '(no translation available for this verse)';
      document.getElementById('trText').textContent = t;
    };
    showTr();
    box.querySelectorAll('#trPills .pill').forEach((p) => p.addEventListener('click', () => {
      state.translation = p.dataset.tr; setSettings({ translation: state.translation });
      box.querySelectorAll('#trPills .pill').forEach((x) => x.classList.toggle('active', x === p));
      showTr();
    }));
    box.querySelectorAll('.rate-btn').forEach((b) => b.addEventListener('click', () => rate(b.dataset.rating)));
    document.getElementById('wpBtn').addEventListener('click', () => toggleWordPictures(verse));
    box.scrollIntoView({ block: 'nearest' });
  }

  /** Robertson's Word Pictures for the verse (PEDAGOGY M20/M28: explicit grammar cashed out in the real text). */
  async function toggleWordPictures(verse) {
    const btn = document.getElementById('wpBtn');
    const el = document.getElementById('wpBody');
    if (!el.hidden) { el.hidden = true; btn.textContent = "Word Pictures · Robertson's note on this verse"; return; }
    el.hidden = false; btn.textContent = 'Hide Word Pictures';
    const slug = verse.id.split('-').slice(0, -2).join('-');
    if (!state.wp[slug]) { el.innerHTML = '<div class="gloss-status">Loading…</div>'; try { state.wp[slug] = await loadWordPictures(slug); } catch (e) { state.wp[slug] = { chapters: {} }; } }
    const text = state.wp[slug].chapters[String(verse.chapter)] && state.wp[slug].chapters[String(verse.chapter)][String(verse.number)];
    el.innerHTML = text
      ? `<div class="wp-text" style="margin-top:10px">${escapeHtml(text).split('\n\n').map((p) => p.replace(/^([^(\n]{1,80}?)\s*\(([^)]*[\u0370-\u03ff][^)]*)\)/, '<b>$1</b> (<span class="gr">$2</span>)')).join('\n\n')}</div><div class="wp-source">A. T. Robertson, Word Pictures in the New Testament (1930–33). Robertson prints Greek without accents.</div>`
      : '<div class="gloss-status" style="margin-top:8px">No note on this verse.</div>';
  }

  function rate(rating) {
    playTick();
    const verse = state.verses[state.index];
    const next = rateVerse(getReadingRecord(verse.id), rating, state.reveals);
    setReadingRecord(verse.id, next);
    const xp = xpForVerse(rating, state.reveals);
    state.xpEarned += xp; xpStat.textContent = addXp(xp).xp;
    state.rated++;
    state.index++;
    renderVerse();
  }

  // ------------------------------------------------------------ summary

  function renderSummary() {
    clearSession(state.sessionKey);
    if (state.rated > 0) { recordActivity(); if (state.lesson) markLessonCompleted(state.lesson.id); playComplete(); }
    const progress = getProgress();
    const tokens = state.coverages.reduce((a, c) => a + c.tokens, 0);
    const known = state.coverages.reduce((a, c) => a + c.known, 0);
    const suggestions = suggestWords(state.allReveals);
    const tapped = [...new Map(state.allReveals.map((w) => [w.l, w])).values()];
    view.renderSummary({
      html: `<div class="card">
        <div class="rule-title">${state.lesson ? escapeHtml(state.lesson.reading.reference) : 'Due verses'}</div>
        <div class="summary-stats">
          <div class="summary-stat"><b>${state.rated}</b><span>verses</span></div>
          <div class="summary-stat"><b>${tokens ? Math.round((known / tokens) * 100) : 0}%</b><span>words known</span></div>
          <div class="summary-stat"><b>+${state.xpEarned}</b><span>xp</span></div>
        </div>
        <p class="rule-body" style="color:var(--muted);font-size:13px">Streak: ${progress.streak} day${progress.streak === 1 ? '' : 's'}. Each verse is now scheduled like a word: the ones you missed come back tomorrow.</p>
        ${tapped.length ? `<div class="summary-list"><div style="font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)">Words you looked up</div>` +
          tapped.map((w) => `<div><span class="greek">${escapeHtml(w.item.lemma)}</span> — ${escapeHtml(w.item.gloss)}${w.glossOnly ? ' <span style="color:var(--muted)">(rare)</span>' : ''}</div>`).join('') + `</div>` : ''}
        ${suggestions.length ? `<div style="margin-top:14px"><button class="btn secondary" id="addWords" type="button">Add ${suggestions.length} looked-up word${suggestions.length === 1 ? '' : 's'} to my vocabulary</button></div>` : ''}
      </div>`,
      kicker: state.lesson ? 'Reading complete' : 'Review complete',
      buttonLabel: nextInChain(params) ? chainLabel(params) : 'Back to path',
    }, () => { location.href = nextInChain(params) || 'index.html'; });
    const addBtn = document.getElementById('addWords');
    if (addBtn) addBtn.addEventListener('click', () => {
      // Enter the words into the SRS as brand-new items due tomorrow (M24: the known set grows from reading).
      suggestions.forEach((it) => { if (!getVocabItem(it.id)) updateVocabItem(it.id, { ...scheduleReview(null, 'miss'), lapses: 0, format: 'reading' }); });
      addBtn.disabled = true; addBtn.textContent = 'Added — they will come up in your next review';
    });
  }
</script>

</body>
</html>
